# cargo-deny (`cargo deny check`, in CI's `fmt` job): known advisories, licences that fit the
# AGPL-3.0, duplicate crates, and where crates come from.

[graph]
# What CI and the release (`.github/workflows/release.yml`) build for.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# Unmaintained crates only where we depend on them ourselves: what we can act on.
unmaintained = "workspace"

[licenses]
# Each can be combined into an AGPL-3.0 program.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# This workspace's own crates: unpublished, under LICENSE (the Homebase.id License).
ignore = true

[bans]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
