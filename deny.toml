# cargo-deny (`cargo deny check`, in CI's `fmt` job): known advisories, licences that fit the
# AGPL-3.0, duplicate crates, and where crates come from.

[graph]
# What CI (x86_64 gnu) and the release (`.github/workflows/release.yml`) build for.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# Unmaintained crates only where we depend on them ourselves: what we can act on.
unmaintained = "workspace"

[licenses]
# Each can be combined into an AGPL-3.0 program.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# This workspace's own crates: unpublished, under LICENSE (the Homebase.id License).
ignore = true

[bans]
# Duplicate versions are shown (cargo-deny's default), not refused: most come with other crates.
wildcards = "deny"
allow-wildcard-paths = true
# blocking 1.7.0 never ends an idle pool thread: zbus's then wakes twice a second for good in the
# daemon and the tray (pinned to 1.6.2 in hbsync-app). Allow a release that ends them again.
deny = [{ crate = "blocking@=1.7.0", reason = "an idle pool thread never ends: 2 wakeups a second" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
