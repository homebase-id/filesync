# Builds the sync root experiment (experiments/win-syncroot) for Windows, to try by hand.
# Only for experiment branches; it holds no secrets and signs nothing.
name: Experiment (Windows sync root)

on:
  push:
    branches: ["experiment/**"]
    paths: ["experiments/win-syncroot/**", ".github/workflows/experiment-win-syncroot.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo build --release --locked
        working-directory: experiments/win-syncroot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebase-syncroot-test
          path: experiments/win-syncroot/target/release/homebase-syncroot-test.exe
          retention-days: 14
