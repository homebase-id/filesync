name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  # Daily on main: advisories published since (the `fmt` job only).
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Also cargo-deny (deny.toml): licences that fit the AGPL-3.0, duplicate crates and sources
  # block; known advisories block only the daily run, so one published meanwhile doesn't turn
  # an unrelated change red.
  fmt:
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: "0.20.2"
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check
        if: github.event_name != 'schedule'
      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/deny.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "$name/cargo-deny"
      - run: cargo deny --locked check bans licenses sources
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
      - run: cargo deny --locked check advisories
        if: ${{ !cancelled() }}
        continue-on-error: ${{ github.event_name != 'schedule' }}

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test (a process waiting on another) fails the job instead of holding a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The shipped crates as a release builds them: without the tests' `testkit` features.
      - run: cargo clippy -p hbsync -p hbsync-tray
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
