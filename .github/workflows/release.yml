name: Release

# Installers and update sites (RELEASING.md, docs/spec/packaging.md). Only `sign` and `sign-dmg`
# hold secrets (the `release-signing` environment); a `v*` tag signs and makes a draft release,
# and publishing it runs publish.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CONVEYOR_VERSION: "22.3"
  CONVEYOR_SHA256: 35b89e746af469f81fb7762a6b14e1458bead71b54b778d199664a871d8e6620
  # Builds the .rpm that ships, so pinned.
  FEDORA_IMAGE: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hbsync") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # vX.Y.Z, or a release candidate vX.Y.Z-rc.N (a pre-release, never published to the
          # update site: publish.yml).
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" \
                && "$GITHUB_REF_NAME" != "v$version"-* ]]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi

  # The three programs per platform, staged as Conveyor takes them: `tray` and `cli` are the
  # folders of the tray and of the daemon and command line (a Mac app's MacOS and Helpers).
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static (musl): runs on any distribution, whatever its glibc. Each on a runner of
          # its own architecture (GitHub's ARM runners), so that the smoke test runs it.
          - { stage: linux-amd64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, tray: bin, cli: bin }
          - { stage: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, tray: bin, cli: bin }
          - { stage: mac-amd64, os: macos-latest, target: x86_64-apple-darwin, tray: MacOS, cli: Helpers }
          - { stage: mac-aarch64, os: macos-latest, target: aarch64-apple-darwin, tray: MacOS, cli: Helpers }
          - { stage: windows-amd64, os: windows-latest, target: x86_64-pc-windows-msvc, tray: ., cli: ., exe: .exe }
          - { stage: windows-aarch64, os: windows-11-arm, target: aarch64-pc-windows-msvc, tray: ., cli: ., exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      TRAY: stage/${{ matrix.stage }}/${{ matrix.tray }}
      CLI: stage/${{ matrix.stage }}/${{ matrix.cli }}
      EXE: ${{ matrix.exe }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # The C runtime linked in: no VC++ redistributable needed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      # Room in the Mach-O headers for Conveyor's Sparkle loader and its signing.
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-headerpad,0xFF
      CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-headerpad,0xFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Windows ARM runner's image may come without rustup.
      - if: matrix.stage == 'windows-aarch64'
        run: |
          if command -v rustup; then exit 0; fi
          url=https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
          curl -sSfLO "$url"
          echo "$(curl -sSfL "$url.sha256" | cut -d' ' -f1)  rustup-init.exe" | sha256sum -c
          ./rustup-init.exe -y --default-toolchain none --profile minimal
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install && rustup target add "$TARGET"
      # Not for a tag: a release build never depends on what earlier runs left in the cache.
      - if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dist-${{ matrix.stage }}
      # A C compiler for musl (bundled SQLite, ring, blake3).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --profile dist -p hbsync -p hbsync-tray --target "$TARGET"
      - name: Stage
        run: |
          out=target/$TARGET/dist
          mkdir -p "$TRAY" "$CLI"
          cp "$out/homebase-filesync$EXE" "$TRAY/"
          cp "$out/hbsync$EXE" "$out/hbsyncd$EXE" "$CLI/"
      # Static, whatever `file` calls it on this architecture.
      - if: runner.os == 'Linux'
        run: if file "$CLI"/* | grep -vE "static-pie linked|statically linked"; then exit 1; fi
      # The Intel Mac programs can't run on the ARM runner: their architecture only.
      - if: matrix.stage == 'mac-amd64'
        run: lipo -archs "$TRAY/homebase-filesync" | grep -Fx x86_64
      - name: Smoke test
        if: matrix.stage != 'mac-amd64'
        run: |
          stamped="$VERSION ($(git rev-parse --short=7 HEAD))"
          "$CLI/hbsync$EXE" --version | grep -Fx "hbsync $stamped"
          "$TRAY/homebase-filesync$EXE" --version | grep -Fx "homebase-filesync $stamped"
          # No daemon in a fresh home: says so, with exit status 3.
          mkdir -p "$RUNNER_TEMP/home"
          rc=0
          HBSYNC_HOME="$RUNNER_TEMP/home" "$CLI/hbsync$EXE" status || rc=$?
          [[ $rc == 3 ]] || { echo "::error::hbsync status exited $rc, not 3"; exit 1; }
      # Artifacts lose the executable bit: tar first.
      - run: tar cf stage-${{ matrix.stage }}.tar stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-${{ matrix.stage }}
          path: stage-${{ matrix.stage }}.tar
          if-no-files-found: error

  # Conveyor's site, with a throwaway key: the signed one comes from `release` (RELEASING.md).
  package:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CONVEYOR_AGREE_TO_LICENSE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stage-*
          path: dl
          merge-multiple: true
      - run: for t in dl/*.tar; do tar xf "$t" -C packaging; done
      - run: packaging/install-conveyor.sh
      - name: Make the site
        working-directory: packaging
        run: |
          conveyor keys generate --no-passphrase --no-keyring -o "$RUNNER_TEMP/keys"
          cat > unsigned.conf <<EOF
          include required("conveyor.conf")
          include required("$RUNNER_TEMP/keys/defaults.conf")
          EOF
          conveyor -f unsigned.conf -Kapp.version="$VERSION" --console=plain make site
          mv output ../site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error

  # A tag's site, signed (RELEASING.md): the feeds with the root key; the Mac app and the
  # Windows packages as well once their secrets exist (self-signed until then). The secrets are
  # in this step's env only.
  sign:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CONVEYOR_AGREE_TO_LICENSE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stage-*
          path: dl
          merge-multiple: true
      - run: for t in dl/*.tar; do tar xf "$t" -C packaging; done
      - run: packaging/install-conveyor.sh
      - name: Make the signed site
        working-directory: packaging
        env:
          CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          APPLE_SIGNING_KEY: ${{ secrets.APPLE_SIGNING_KEY }}
          APPLE_SIGNING_KEY_PASS: ${{ secrets.APPLE_SIGNING_KEY_PASS }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if [[ -z "$CONVEYOR_SIGNING_KEY" ]]; then
            echo "::error::no CONVEYOR_SIGNING_KEY in release-signing"; exit 1
          fi
          echo 'include required("conveyor-production.conf")' > signed.conf
          if [[ -n "$APPLE_SIGNING_KEY" ]]; then
            keys="$RUNNER_TEMP/apple"
            mkdir -m 700 "$keys"
            printf '%s' "$APPLE_SIGNING_KEY" | base64 -d > "$keys/developerid.p12"
            printf '%s\n' "$APPLE_NOTARIZATION_KEY" > "$keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
            export APPLE_P12_PATH="$keys/developerid.p12"
            export APPLE_NOTARIZATION_KEY_PATH="$keys/AuthKey_$APPSTORE_API_KEY_ID.p8"
            echo 'include required("conveyor-apple.conf")' >> signed.conf
          else
            echo "::warning::no Apple secrets yet: the Mac app is self-signed"
          fi
          if [[ -n "$AZURE_CLIENT_ID" ]]; then
            # azure/login isn't an allowed action: GitHub's OIDC token exchanged by hand. The
            # tokens are masked before anything is printed; Azure's error, if any, is shown.
            oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
            echo "::add-mask::$oidc"
            answer=$(curl -sS "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
              --data-urlencode "client_id=$AZURE_CLIENT_ID" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
              --data-urlencode "client_assertion=$oidc" \
              --data-urlencode "scope=https://codesigning.azure.net/.default")
            AZURE_ACCESS_TOKEN=$(jq -r '.access_token // empty' <<< "$answer")
            if [[ -z "$AZURE_ACCESS_TOKEN" ]]; then
              echo "::error::Azure gave no token: $(jq -c '{error, error_description}' <<< "$answer")"
              exit 1
            fi
            echo "::add-mask::$AZURE_ACCESS_TOKEN"
            export AZURE_ACCESS_TOKEN
            AZURE_SIGNING_ENDPOINT=${AZURE_SIGNING_ENDPOINT#https://}
            export AZURE_SIGNING_ENDPOINT=${AZURE_SIGNING_ENDPOINT%/}
            echo 'include required("conveyor-azure.conf")' >> signed.conf
          else
            echo "::warning::no Azure signing yet: the Windows packages are self-signed"
          fi
          conveyor -f signed.conf -Kapp.version="$VERSION" --console=plain make site
          mv output ../signed-site
      - if: always()
        run: rm -rf "$RUNNER_TEMP/apple"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-site
          path: signed-site
          if-no-files-found: error

  # From a tag's signed site, else the throwaway one.
  dmg:
    needs: [version, package, sign]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.ref_type == 'tag' && 'signed-site' || 'site' }}
          path: site
      - name: Make the disk images
        run: |
          mkdir dmg
          for arch in aarch64 amd64; do
            packaging/macos/make-dmg.sh site/homebase-filesync-$VERSION-mac-$arch.zip \
              dmg/Homebase-Filesync-$VERSION-mac-$arch.dmg
          done
      - name: Test the Apple Silicon one
        run: |
          mount=$(hdiutil attach -nobrowse -readonly dmg/Homebase-Filesync-$VERSION-mac-aarch64.dmg \
            | tail -1 | cut -f3)
          app="$mount/Homebase Filesync.app"
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$app"
          plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist" | grep -Fx homebase-filesync
          "$app/Contents/MacOS/homebase-filesync" --version
          "$app/Contents/Helpers/hbsync" --version
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dmg/*.dmg
          if-no-files-found: error

  # A tag's disk images signed with the Developer ID, notarized and stapled (the app inside
  # already is: Conveyor signs and notarizes it in `sign`). The secrets are in their steps' env
  # only; the keychain lives in $RUNNER_TEMP and is deleted at the end.
  sign-dmg:
    if: github.ref_type == 'tag'
    needs: [version, dmg]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dmg
      - name: Sign
        env:
          APPLE_SIGNING_KEY: ${{ secrets.APPLE_SIGNING_KEY }}
          APPLE_SIGNING_KEY_PASS: ${{ secrets.APPLE_SIGNING_KEY_PASS }}
        run: |
          if [[ -z "$APPLE_SIGNING_KEY" ]]; then
            echo "::error::no APPLE_SIGNING_KEY in release-signing"; exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/developerid.p12"
          printf '%s' "$APPLE_SIGNING_KEY" | base64 --decode > "$p12"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$p12" -k "$KEYCHAIN" -P "$APPLE_SIGNING_KEY_PASS" -T /usr/bin/codesign
          rm "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" > /dev/null
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ { print $2; exit }')
          if [[ -z "$identity" ]]; then
            echo "::error::no Developer ID Application identity in the .p12"; exit 1
          fi
          for dmg in dmg/*.dmg; do
            codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$identity" "$dmg"
            codesign --verify --strict "$dmg"
          done
      - name: Notarize and staple
        env:
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$APPSTORE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_NOTARIZATION_KEY" > "$key"
          for dmg in dmg/*.dmg; do
            answer=$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPSTORE_API_KEY_ID" \
              --issuer "$APPSTORE_API_ISSUER_ID" --wait --timeout 30m --output-format json)
            if [[ $(jq -r .status <<< "$answer") != Accepted ]]; then
              echo "::error::$dmg wasn't notarized: $answer"
              xcrun notarytool log "$(jq -r .id <<< "$answer")" --key "$key" \
                --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID" || true
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done
          rm "$key"
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP"/developerid.p12 "$RUNNER_TEMP"/AuthKey_*.p8
      # What a Mac does with a download: the disk image and the app inside both pass Gatekeeper,
      # notarized, with the ticket stapled (so it opens offline too).
      - name: Check them as Gatekeeper does
        run: |
          for dmg in dmg/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
            mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)
            app="$mount/Homebase Filesync.app"
            codesign --verify --deep --strict "$app"
            verdict=$(spctl --assess --type execute -vv "$app" 2>&1)
            echo "$verdict"
            grep -q "Notarized Developer ID" <<< "$verdict"
            xcrun stapler validate "$app"
            hdiutil detach "$mount"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-dmg
          path: dmg/*.dmg
          if-no-files-found: error

  # A tag's Windows packages, signed by Azure Trusted Signing: they install on a fresh runner
  # without trusting any certificate first, and signtool accepts them.
  test-signed-msix:
    if: github.ref_type == 'tag'
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-site
          path: site
      - name: Verify the signatures, install, remove
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          foreach ($f in Get-ChildItem site/*.msix, site/*.exe) {
            & $signtool.FullName verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($f.Name) isn't validly signed" }
          }
          Add-AppxPackage -Path (Get-ChildItem "site/*.x64.msix").FullName
          $p = Get-AppxPackage HomebaseFilesync
          if (-not $p) { throw "not installed" }
          Write-Output "installed $($p.PackageFullName), publisher $($p.Publisher)"
          Remove-AppxPackage $p.PackageFullName

  # The .rpm is Conveyor's .deb, its files as they are (without the apt repository it adds),
  # packaged by Fedora's own rpmbuild, for each architecture on a runner of its own.
  rpm:
    needs: [version, package]
    strategy:
      matrix:
        include:
          - { deb: amd64, rpm: x86_64, os: ubuntu-latest }
          - { deb: arm64, rpm: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.rpm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - run: dpkg-deb -x site/homebase-filesync_*_${{ matrix.deb }}.deb deb && rm -r deb/etc && mkdir rpm
      - name: Build, then install, run and remove
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION -e ARCH "$FEDORA_IMAGE" bash -euc '
            dnf -y -q install rpm-build >/dev/null
            rpmbuild -bb --define "_topdir /tmp/rpm" --define "pkg_version $VERSION" \
              --define "pkg_arch $ARCH" --define "root /src/deb" --define "src /src" \
              packaging/linux/homebase-filesync.spec
            cp /tmp/rpm/RPMS/$ARCH/*.rpm rpm/'
          docker run --rm -v "$PWD/rpm:/rpm:ro" "$FEDORA_IMAGE" bash -euxc '
            dnf -y -q --setopt=install_weak_deps=False install /rpm/*.rpm desktop-file-utils >/dev/null
            hbsync --version
            homebase-filesync --version
            desktop-file-validate /usr/share/applications/id.homebase.filesync.desktop
            dnf -y -q remove homebase-filesync >/dev/null
            test ! -e /usr/bin/hbsync'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.rpm }}
          path: rpm/*.rpm
          if-no-files-found: error

  test-deb:
    needs: package
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: {}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Install, run, remove
        run: |
          docker run --rm -v "$PWD/site:/site:ro" -e ARCH ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends /site/homebase-filesync_*_$ARCH.deb desktop-file-utils >/dev/null
            hbsync --version
            homebase-filesync --version
            desktop-file-validate /usr/share/applications/id.homebase.filesync.desktop
            test -f /etc/apt/sources.list.d/homebase-filesync.sources
            apt-get remove -y -qq homebase-filesync >/dev/null
            test ! -e /usr/bin/hbsync'

  test-msix:
    needs: package
    strategy:
      matrix:
        include:
          - { arch: x64, os: windows-latest }
          - { arch: arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: {}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Install, run, remove
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Self-signed in these builds: trusted first, as Conveyor's install.ps1 does.
          Import-Certificate -FilePath site/homebase-filesync.crt -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path (Get-ChildItem "site/*.$env:ARCH.msix").FullName
          $p = Get-AppxPackage HomebaseFilesync
          Start-Process "shell:AppsFolder\$($p.PackageFamilyName)!HomebaseFilesync"
          Start-Sleep -Seconds 15
          if (-not (Get-Process homebase-filesync -ErrorAction SilentlyContinue)) { throw "the tray isn't running" }
          # Its files go to the real LocalAppData (excluded from the package's virtualization).
          if (-not (Test-Path "$env:LOCALAPPDATA\Homebase Filesync\logs")) { throw "no log in LocalAppData" }
          Get-Process homebase-filesync, hbsyncd -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-AppxPackage $p.PackageFullName
          if (Get-AppxPackage HomebaseFilesync) { throw "still installed" }

  # The draft release of a tag: the whole signed site (its feeds too, so that publishing can
  # upload exactly these files: publish.yml), the disk images and the .rpm files.
  release:
    if: github.ref_type == 'tag'
    needs: [version, sign, sign-dmg, rpm, test-deb, test-msix, test-signed-msix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{signed-site,signed-dmg,rpm-*}"
          path: assets
          merge-multiple: true
      # Copies without the version, so a link to releases/latest/download/<name> always finds
      # the newest (chat's setup screen links them). The Windows installer's name has none.
      - name: Fixed names
        env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: assets
        run: |
          for arch in aarch64 amd64; do
            cp "Homebase-Filesync-$VERSION-mac-$arch.dmg" "Homebase-Filesync-mac-$arch.dmg"
          done
          for arch in amd64 arm64; do
            cp "homebase-filesync_${VERSION}_$arch.deb" "homebase-filesync_$arch.deb"
          done
          test -f homebase-filesync.exe
      - run: cd assets && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      # A draft: visible to the repository's members until published by hand.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          candidate=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then candidate=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" assets/* --draft --verify-tag "${candidate[@]}" \
            --title "Homebase Filesync ${GITHUB_REF_NAME#v}" --notes-file .github/release/notes.md
