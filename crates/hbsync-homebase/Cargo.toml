[package]
name = "hbsync-homebase"
description = "The Homebase side: YouAuth app registration, the shared-secret envelope, the V2 API client"
version.workspace = true
license-file.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# zeroize: key schedules and chaining state are wiped when dropped.
aes = { version = "0.9.3", features = ["zeroize"] }
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
getrandom = "0.3"
hbsync-fileio.workspace = true
hbsync-remote.workspace = true
hbsync-types.workspace = true
hkdf = "0.13.0"
p384 = { version = "0.14.0", features = ["ecdh"] }
percent-encoding = "2.3.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tracing = "0.1.44"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.4.2", features = ["json"] }
uuid.workspace = true
webpki-roots = "1"
zeroize = "1.8"

[lints]
workspace = true
