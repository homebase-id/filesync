[package]
name = "hbsync-platform"
description = "OS differences behind one API: paths, file ids, atomic replace, timestamps, locks"
version.workspace = true
license-file.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
caseless = "0.2.2"
filetime = "0.2.29"
tempfile.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Finder's tags attribute.
[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1.7", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_Ioctl",
  "Win32_System_WindowsProgramming",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# Finder's tags attribute, its codec tested on every OS.
plist = { version = "1.7", default-features = false }
proptest.workspace = true
