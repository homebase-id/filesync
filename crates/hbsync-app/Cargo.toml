[package]
name = "hbsync-app"
description = "The product shell: paths, config, credentials, the sync runner, IPC, autostart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hbsync-homebase.workspace = true
keyring-core = "1"
serde_json.workspace = true
hbsync-platform.workspace = true
hbsync-remote.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml = "1.1"
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[lints]
workspace = true
