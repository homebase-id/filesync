[package]
name = "hbsync-app"
description = "The product shell: paths, config, credentials, the sync runner, IPC, autostart"
version.workspace = true
license-file.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hbsync-engine.workspace = true
hbsync-fileio.workspace = true
hbsync-homebase.workspace = true
hbsync-local.workspace = true
form_urlencoded = "1.2"
interprocess = "2.4"
keyring-core = "1"
percent-encoding = "2"
serde_json.workspace = true
hbsync-platform.workspace = true
hbsync-remote.workspace = true
hbsync-state.workspace = true
hbsync-types.workspace = true
serde.workspace = true
thiserror.workspace = true
toml = "1.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# The folder's icon in Finder.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.0.2"
# The MSIX startup task and the folder's sync root (WinRT).
windows = { version = "0.62", features = ["ApplicationModel", "Storage", "Storage_Provider", "Storage_Search", "Storage_Streams"] }
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The secret service's, already: systemd's scopes (`unit`).
zbus = "5.19"

[features]
# Counters the tests wait on (`testkit`).
testkit = []

[dev-dependencies]
hbsync-app = { path = ".", features = ["testkit"] }
hbsync-remote = { workspace = true, features = ["testkit"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
