[package]
name = "hbsync-app"
description = "The product shell: paths, config, credentials, the sync runner, IPC, autostart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hbsync-engine.workspace = true
hbsync-homebase.workspace = true
hbsync-local.workspace = true
interprocess = "2.4"
keyring-core = "1"
serde_json.workspace = true
hbsync-platform.workspace = true
hbsync-remote.workspace = true
hbsync-state.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml = "1.1"
tracing = "0.1.44"
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.0.2"
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[lints]
workspace = true
