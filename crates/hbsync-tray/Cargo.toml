[package]
name = "hbsync-tray"
description = "Homebase Filesync in the tray: status, pause, login, recently synced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hbsync-app.workspace = true
hbsync-homebase.workspace = true
hbsync-types.workspace = true
notify-rust = "4.18"
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
uuid.workspace = true

# Linux: the StatusNotifierItem over D-Bus (what KDE and the AppIndicator extension show), in
# pure Rust: no GTK, no event loop of its own.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Windows and macOS: the tray needs an event loop on the thread that made it (the main thread).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The folder's icon in Finder.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }

# The folder's attributes for its icon in Explorer.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
