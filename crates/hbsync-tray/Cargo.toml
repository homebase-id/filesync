[package]
name = "hbsync-tray"
description = "Homebase Filesync in the tray: status, pause, login, recently synced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hbsync-app.workspace = true
hbsync-types.workspace = true
form_urlencoded = "1.2"
notify-rust = "4.18"
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tracing = "0.1.44"
uuid.workspace = true

# Linux: the StatusNotifierItem over D-Bus (what KDE and the AppIndicator extension show), in
# pure Rust: no GTK, no event loop of its own.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Windows and macOS: the tray needs an event loop on the thread that made it (the main thread).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
