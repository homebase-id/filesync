[package]
name = "hbsync-tray"
description = "Homebase Filesync in the tray: status, pause, login, recently synced"
version.workspace = true
license-file.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The name people see (System Monitor, Task Manager, Activity Monitor) and Conveyor's entry point.
[[bin]]
name = "homebase-filesync"
path = "src/main.rs"

[dependencies]
hbsync-app.workspace = true
hbsync-types.workspace = true
notify-rust = "4.18"
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tracing = "0.1.44"
uuid.workspace = true

# Linux: the StatusNotifierItem over D-Bus (what KDE and the AppIndicator extension show), in
# pure Rust: no GTK, no event loop of its own.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

# Windows and macOS: the tray needs an event loop on the thread that made it (the main thread).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tao = "0.37"
# Exactly the patched copy's version (vendor/tray-icon/PATCHED.md): a newer release can't leave
# the patch unused.
tray-icon = "=0.26.1"

# Windows: the window that owns the folder picker, to open it in front of the browser.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
hbsync-app = { workspace = true, features = ["testkit"] }
tempfile.workspace = true

[lints]
workspace = true
