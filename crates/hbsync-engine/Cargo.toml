[package]
name = "hbsync-engine"
description = "Sync engine: tree model, pure reconciler, executor, scheduler, start-up"
version.workspace = true
license-file.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hbsync-fileio.workspace = true
hbsync-local.workspace = true
hbsync-namemap.workspace = true
hbsync-platform.workspace = true
hbsync-remote.workspace = true
hbsync-state.workspace = true
hbsync-types.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tracing = "0.1.44"

[features]
# A test client (`testkit`) for the engine's tests and the live ones.
testkit = ["dep:tempfile", "hbsync-state/testkit"]

[dev-dependencies]
hbsync-engine = { path = ".", features = ["testkit"] }
proptest.workspace = true
uuid.workspace = true
tempfile.workspace = true

[lints]
workspace = true
