// The Mac app signed with the Developer ID and notarized (the release workflow's sign job):
// `certificate` is the Developer ID certificate alone (DER), the key comes from the .p12.
app.mac {
  certificate = ${env.APPLE_CERT_PATH}
  signing-key.file = {
    path = ${env.APPLE_P12_PATH}
    password = ${env.APPLE_SIGNING_KEY_PASS}
  }
  notarization {
    issuer-id = ${env.APPSTORE_API_ISSUER_ID}
    key-id = ${env.APPSTORE_API_KEY_ID}
    private-key = ${env.APPLE_NOTARIZATION_KEY_PATH}
  }
}
