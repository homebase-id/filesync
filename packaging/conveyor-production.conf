// The production channel: its update site and the signing identities, as chat-kmp's
// desktopApp/conveyor_production.conf. Only the release workflow's signing job, in the protected
// release-signing environment, has these variables (RELEASING.md).
include required("conveyor.conf")

app {
  site.base-url = "https://github.com/homebase-id/filesync-release-production/releases/latest/download"
  signing-key = ${env.CONVEYOR_SIGNING_KEY}

  windows {
    signing-key {
      azure-trusted-signing {
        endpoint = "eus.codesigning.azure.net"
        api-access-token = ${env.AZURE_ACCESS_TOKEN}
      }
    }
    // vars.AZURE_SIGNING_PROFILE, passed into the environment by the signing step.
    signing-key-alias = ${env.AZURE_SIGNING_PROFILE}
  }

  mac {
    certificate = ${env.APPLE_P12_PATH}
    signing-key.file = {
      path = ${env.APPLE_P12_PATH}
      password = ${env.APPLE_SIGNING_KEY_PASS}
    }
    notarization {
      issuer-id = ${env.APPSTORE_API_ISSUER_ID}
      key-id = ${env.APPSTORE_API_KEY_ID}
      private-key = ${env.APPLE_NOTARIZATION_KEY}
    }
  }
}
