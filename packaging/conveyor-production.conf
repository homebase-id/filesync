// The production channel, as chat-kmp's desktopApp/conveyor_production.conf: its update site and
// the root key that signs the feeds (Sparkle, the apt repository, the .appinstaller). The
// release workflow's sign job adds conveyor-apple.conf and conveyor-azure.conf when their
// secrets exist; until then the Mac and Windows packages are self-signed (RELEASING.md).
include required("conveyor.conf")

app {
  site.base-url = "https://github.com/homebase-id/filesync-release-production/releases/latest/download"
  signing-key = ${env.CONVEYOR_SIGNING_KEY}
}
