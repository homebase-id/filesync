// Conveyor packaging for Homebase Filesync (https://conveyor.hydraulic.dev), like chat-kmp's
// desktopApp/conveyor*.conf; docs/spec/packaging.md. The release workflow stages the programs
// in packaging/stage/{windows,mac,linux}-{amd64,aarch64} and passes app.version and the key.
// This file alone makes the bleeding channel; conveyor-production.conf adds the production
// site and the signing identities.

app {
  display-name = "Homebase Filesync"
  rdns-name = "id.homebase.filesync"
  fsname = "homebase-filesync"
  long-fsname = "homebase-filesync"
  vendor = "Homebase"
  contact-email = "apps@vidence.co"
  vcs-url = "https://github.com/homebase-id/filesync"
  license = "AGPL-3.0"
  icons = ../crates/hbsync-tray/assets/mark.svg
  updates = aggressive
  // Conveyor's defaults (Windows and Linux on Intel, both Macs), and ARM Windows and Linux.
  machines = [ windows.amd64, windows.aarch64, mac.amd64, mac.aarch64, linux.amd64.glibc, linux.aarch64.glibc ]
  // Where the packages look for updates (a GitHub repo of releases, as chat-kmp's).
  site.base-url = "https://github.com/homebase-id/filesync-release-bleeding/releases/latest/download"

  windows {
    // Conveyor's entry point is the exe named after fsname: the tray, homebase-filesync.exe.
    amd64.inputs += stage/windows-amd64
    aarch64.inputs += stage/windows-aarch64
    start-on-login = true
    // No `hbsync` alias: an MSIX app may declare one execution alias, and Conveyor's is the
    // tray's. The command line on Windows comes with the zip.
    // Config, credentials' file fallback, state and logs stay where the CLI and zip builds look.
    manifests.msix.virtualization.excluded-directories = [ "RoamingAppData/Homebase Filesync", "LocalAppData/Homebase Filesync" ]
  }

  mac {
    // Staged as MacOS (the tray alone: Conveyor launches the one it finds there) and Helpers
    // (the daemon and the command line; crates/hbsync-app/src/install.rs).
    amd64.inputs += "stage/mac-amd64 -> Contents"
    aarch64.inputs += "stage/mac-aarch64 -> Contents"
    // Not a camera or microphone app (Conveyor's defaults ask for both).
    info-plist.NSCameraUsageDescription = null
    info-plist.NSMicrophoneUsageDescription = null
    // A menu bar app: no Dock icon. (macOS 11 at least: Conveyor's default, and the
    // workflow's MACOSX_DEPLOYMENT_TARGET.)
    info-plist.LSUIElement = true
  }

  linux {
    amd64.glibc.inputs += stage/linux-amd64
    aarch64.glibc.inputs += stage/linux-aarch64
    main-binary = bin/homebase-filesync
    symlinks += ${app.linux.prefix}/bin/hbsync -> ${app.linux.install-path}/bin/hbsync
    debian.control.Recommends = "xdg-desktop-portal"
    desktop-file."Desktop Entry".Categories = "Network;FileTransfer;"
    desktop-file."Desktop Entry".Comment = "Keeps your Homebase folder in sync"
  }
}

conveyor.compatibility-level = 21
