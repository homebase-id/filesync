// The MSIX and the EXEs signed with Azure Trusted Signing (the release workflow's sign job; the
// token comes from OIDC there). The alias is "<account>/<certificate profile>", as chat-kmp's;
// the endpoint is the host alone (the job strips the variable's https:// and slash).
app.windows {
  signing-key {
    azure-trusted-signing {
      endpoint = ${env.AZURE_SIGNING_ENDPOINT}
      api-access-token = ${env.AZURE_ACCESS_TOKEN}
    }
  }
  signing-key-alias = ${env.AZURE_SIGNING_ACCOUNT}"/"${env.AZURE_SIGNING_PROFILE}
}
