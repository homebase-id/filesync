// The MSIX and the EXEs signed with Azure Trusted Signing (the release workflow's sign job; the
// token comes from OIDC there).
app.windows {
  signing-key {
    azure-trusted-signing {
      endpoint = "eus.codesigning.azure.net"
      api-access-token = ${env.AZURE_ACCESS_TOKEN}
    }
  }
  signing-key-alias = ${env.AZURE_SIGNING_PROFILE}
}
