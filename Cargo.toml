[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
hbsync-app = { path = "crates/hbsync-app" }
hbsync-dev = { path = "crates/hbsync-dev" }
hbsync-engine = { path = "crates/hbsync-engine" }
hbsync-fileio = { path = "crates/hbsync-fileio" }
hbsync-homebase = { path = "crates/hbsync-homebase" }
hbsync-local = { path = "crates/hbsync-local" }
hbsync-namemap = { path = "crates/hbsync-namemap" }
hbsync-platform = { path = "crates/hbsync-platform" }
hbsync-remote = { path = "crates/hbsync-remote" }
hbsync-state = { path = "crates/hbsync-state" }
hbsync-tray = { path = "crates/hbsync-tray" }
hbsync-types = { path = "crates/hbsync-types" }
proptest = "1.11"
rusqlite = { version = "0.40", features = ["bundled", "collation", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3.27"
thiserror = "2"
uuid = { version = "1.27", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The release archives (`.github/workflows/release.yml`); tests' `--release` builds stay fast.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
